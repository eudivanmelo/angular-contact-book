<div class="contact-list card">
  <p-toast></p-toast>
  <p-confirmdialog></p-confirmdialog>

  <div class="contact-list__header">
    <h2 class="contact-list__title">{{ contacts().length }} contato(s)</h2>
  </div>

  @if (hasContacts()) {
    <ul class="contact-list__items">
      @for (contact of contacts(); track contact.id; let index = $index) {
        <li class="contact-list__item" [class.contact-list__item--featured]="index === 0">
          <div class="contact-list__avatar">{{ contact | contactInitials }}</div>

          <div class="contact-list__content">
            <h3>{{ contact.name | titlecase }}</h3>
            <p>{{ contact.email }}</p>
            <span>{{ contact.phone }}</span>
          </div>

          <div class="contact-list__actions">
            <p-button
              icon="pi pi-pencil"
              styleClass="p-button-rounded p-button-info p-button-text"
              (onClick)="editContact(contact)"
            ></p-button>
            <p-button
              icon="pi pi-trash"
              styleClass="p-button-rounded p-button-danger p-button-text"
              (onClick)="deleteContact($event, contact)"
            ></p-button>
          </div>
        </li>
      }
    </ul>
  } @else {
    <div class="contact-list__empty">{{ emptyMessage() }}</div>
  }
</div>
