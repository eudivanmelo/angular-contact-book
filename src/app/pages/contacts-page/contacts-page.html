<section class="contacts-page">
  <div class="contacts-page__toolbar">
    <app-contact-search class="contacts-page__search" (search)="onSearch($event)" />
    <p-button label="Novo contato" icon="pi pi-plus" severity="secondary" (onClick)="openNew()"></p-button>
  </div>

  <app-contact-list
    [searchTerm]="searchTerm()"
    (edit)="editContact($event)"
    (deleted)="onContactDeleted()"
  />

  <p-dialog [header]="dialogTitle()" [visible]="contactDialog()" [modal]="true" (onHide)="hideDialog()">
    <app-contact-form [contact]="contact()" (saved)="onContactSaved()" />
  </p-dialog>
</section>
