<div class="p-16 px-48">
  <div class="my-4 flex justify-between">
    <h1 class="text-2xl font-bold">Agenda de Contatos</h1>

    <div class="flex gap-2">
      <app-contact-search></app-contact-search>
      <p-button label="Novo contato" icon="pi pi-plus" (onClick)="openNew()"></p-button>
    </div>
  </div>

  <div class="my-4">
    <app-contact-list (onEdit)="editContact($event)"></app-contact-list>
  </div>

  <p-dialog header="Contato" [(visible)]="contactDialog" [modal]="true" (onHide)="hideDialog()">
    <app-contact-form [contact]="contact"></app-contact-form>
  </p-dialog>
</div>
